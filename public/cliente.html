<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acheei - Área do Cliente</title>
  <meta name="description" content="Acompanhe seus orçamentos e converse com profissionais.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    .cliente-body { background: #f0f0f0; }
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--black-primary), var(--red-dark)); }
    .auth-card { background: var(--white); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
    .auth-card .logo { text-align: center; margin-bottom: 24px; }
    .auth-card .logo h1 { font-size: 32px; color: var(--red-primary); font-weight: 800; }
    .auth-card .logo p { color: var(--gray-medium); font-size: 14px; margin-top: 4px; }
    .auth-tabs { display: flex; margin-bottom: 24px; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid var(--gray-lighter); }
    .auth-tab { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); background: var(--white); color: var(--gray-medium); border: none; }
    .auth-tab.active { background: var(--red-primary); color: var(--white); }
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .auth-form .form-group { margin-bottom: 16px; }
    .auth-form .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-dark); margin-bottom: 6px; }
    .auth-form .form-group input { width: 100%; padding: 12px 16px; border: 2px solid var(--gray-lighter); border-radius: var(--radius-sm); font-size: 15px; transition: var(--transition); }
    .auth-form .form-group input:focus { outline: none; border-color: var(--red-primary); box-shadow: 0 0 0 3px rgba(255,0,0,0.1); }
    .auth-form .btn { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }
    .auth-error { color: #dc3545; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
    .auth-success { color: #28a745; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
    .dashboard { display: none; min-height: 100vh; }
    .dashboard-header { background: var(--white); box-shadow: var(--shadow-sm); padding: 0 20px; position: sticky; top: 0; z-index: 100; }
    .dashboard-nav { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .dashboard-nav .logo { font-size: 22px; font-weight: 800; color: var(--red-primary); }
    .dashboard-nav .cliente-info { display: flex; align-items: center; gap: 16px; }
    .dashboard-nav .cliente-info span { color: var(--gray-medium); font-size: 14px; }
    .dashboard-nav .cliente-info .btn { padding: 8px 16px; font-size: 13px; }
    .dashboard-content { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .dashboard-tabs { display: flex; gap: 0; margin-bottom: 24px; background: var(--white); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
    .dashboard-tab { flex: 1; padding: 16px 24px; text-align: center; font-weight: 600; font-size: 14px; color: var(--gray-medium); cursor: pointer; transition: var(--transition); border: none; background: none; border-bottom: 3px solid transparent; }
    .dashboard-tab:hover { color: var(--red-primary); background: rgba(255,0,0,0.03); }
    .dashboard-tab.active { color: var(--red-primary); border-bottom-color: var(--red-primary); }
    .dashboard-tab .count { display: inline-block; background: var(--gray-lighter); color: var(--gray-dark); padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 6px; }
    .dashboard-tab.active .count { background: rgba(255,0,0,0.1); color: var(--red-primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    .solicitacao-card { background: var(--white); border-radius: var(--radius-md); padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-lighter); }
    .solicitacao-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
    .solicitacao-card .card-header .prof-info { display: flex; align-items: center; gap: 12px; }
    .solicitacao-card .card-header .prof-info .foto { width: 48px; height: 48px; border-radius: var(--radius-full); object-fit: cover; border: 2px solid var(--red-primary); }
    .solicitacao-card .card-header .prof-info .foto-placeholder { width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--gray-lighter); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .solicitacao-card .card-header .prof-info h4 { font-size: 16px; margin-bottom: 2px; }
    .solicitacao-card .card-header .prof-info .profissao { font-size: 13px; color: var(--red-primary); font-weight: 600; }
    .solicitacao-card .card-header .date { font-size: 12px; color: var(--gray-light); white-space: nowrap; }
    .solicitacao-card .descricao { color: var(--gray-dark); font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
    .solicitacao-card .card-footer { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--gray-lighter); padding-top: 12px; }
    .solicitacao-card .card-footer .btn { padding: 8px 16px; font-size: 13px; }
    .orcamento-card { background: var(--white); border-radius: var(--radius-md); padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-lighter); }
    .orcamento-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
    .orcamento-card .card-header .prof-info { display: flex; align-items: center; gap: 12px; }
    .orcamento-card .card-header .prof-info .foto { width: 48px; height: 48px; border-radius: var(--radius-full); object-fit: cover; border: 2px solid var(--red-primary); }
    .orcamento-card .card-header .prof-info .foto-placeholder { width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--gray-lighter); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .orcamento-card .card-header .prof-info h4 { font-size: 16px; margin-bottom: 2px; }
    .orcamento-card .card-header .prof-info .profissao { font-size: 13px; color: var(--red-primary); font-weight: 600; }
    .orcamento-card .valor { font-size: 24px; font-weight: 800; color: var(--red-primary); margin: 8px 0; }
    .orcamento-card .descricao { color: var(--gray-dark); font-size: 14px; line-height: 1.5; }
    .orcamento-card .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-badge.pendente { background: #fff3cd; color: #856404; }
    .status-badge.aprovado { background: #d4edda; color: #155724; }
    .status-badge.recusado { background: #f8d7da; color: #721c24; }
    .chat-container { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow: hidden; }
    .chat-messages { padding: 20px; max-height: 400px; overflow-y: auto; }
    .chat-message { margin-bottom: 16px; display: flex; }
    .chat-message.cliente { justify-content: flex-end; }
    .chat-message .bubble { max-width: 75%; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; }
    .chat-message.cliente .bubble { background: var(--red-primary); color: var(--white); border-bottom-right-radius: 4px; }
    .chat-message.profissional .bubble { background: var(--gray-bg); color: var(--black-primary); border-bottom-left-radius: 4px; }
    .chat-message .time { font-size: 11px; color: var(--gray-light); margin-top: 4px; }
    .chat-message.cliente .time { text-align: right; color: rgba(255,255,255,0.7); }
    .chat-input-area { display: flex; gap: 8px; padding: 16px; border-top: 1px solid var(--gray-lighter); }
    .chat-input-area input { flex: 1; padding: 12px 16px; border: 2px solid var(--gray-lighter); border-radius: var(--radius-sm); font-size: 14px; }
    .chat-input-area input:focus { outline: none; border-color: var(--red-primary); }
    .chat-input-area .btn { padding: 12px 20px; }
    .chat-selector { margin-bottom: 16px; }
    .chat-selector select { width: 100%; padding: 12px 16px; border: 2px solid var(--gray-lighter); border-radius: var(--radius-sm); font-size: 15px; }
    @media (max-width: 768px) { .dashboard-tabs { flex-direction: column; } .solicitacao-card .card-header { flex-direction: column; } }
  </style>
</head>
<body class="cliente-body">

<div class="auth-container" id="authScreen">
  <div class="auth-card">
    <div class="logo">
      <h1>Acheei</h1>
      <p>Área do Cliente</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
      <button class="auth-tab" onclick="switchAuthTab('cadastro')">Cadastrar</button>
    </div>

    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" placeholder="Sua senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
      <div class="auth-error" id="loginError">Email ou senha inválidos</div>
    </form>

    <form class="auth-form" id="cadastroForm">
      <div class="form-group">
        <label for="cadastroNome">Nome Completo</label>
        <input type="text" id="cadastroNome" placeholder="Seu nome" required>
      </div>
      <div class="form-group">
        <label for="cadastroEmail">Email</label>
        <input type="email" id="cadastroEmail" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label for="cadastroSenha">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="cadastroSenha" placeholder="Sua senha" required minlength="6">
      </div>
      <div class="form-group">
        <label for="cadastroTelefone">Telefone</label>
        <input type="tel" id="cadastroTelefone" placeholder="(11) 99999-9999">
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Criar Conta</button>
      <div class="auth-error" id="cadastroError"></div>
      <div class="auth-success" id="cadastroSuccess">Conta criada! Entrando...</div>
    </form>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <header class="dashboard-header">
    <div class="dashboard-nav">
      <div class="logo">Acheei Cliente</div>
      <div class="cliente-info">
        <span id="clienteName">Cliente</span>
        <button class="btn btn-outline btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>
  </header>

  <div class="dashboard-content">
    <div class="dashboard-tabs">
      <button class="dashboard-tab active" onclick="switchTab('solicitacoes', this)">
        📋 Solicitações <span class="count" id="countSolicitacoes">0</span>
      </button>
      <button class="dashboard-tab" onclick="switchTab('orcamentos', this)">
        💰 Orçamentos <span class="count" id="countOrcamentos">0</span>
      </button>
      <button class="dashboard-tab" onclick="switchTab('chat', this)">
        💬 Chat
      </button>
    </div>

    <div class="tab-content active" id="tabSolicitacoes">
      <div id="solicitacoesList"></div>
    </div>

    <div class="tab-content" id="tabOrcamentos">
      <div id="orcamentosList"></div>
    </div>

    <div class="tab-content" id="tabChat">
      <div class="chat-selector">
        <select id="chatSolicitacaoSelect" onchange="carregarChat()">
          <option value="">Selecione uma solicitação...</option>
        </select>
      </div>
      <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagemCliente()">
          <button class="btn btn-primary" onclick="enviarMensagemCliente()">Enviar</button>
        </div>
      </div>
      <div id="chatEmptyState" class="empty-state">
        <span class="icon">💬</span>
        <h3>Selecione uma solicitação</h3>
        <p>Escolha uma solicitação acima para conversar com o profissional.</p>
      </div>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/cliente.js"></script>
</body>
</html>
