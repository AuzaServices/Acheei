<script>
    // Estado otimista do header: aplica imediatamente (de forma síncrona) o estado
    // logado/deslogado assim que o HTML é montado, eliminando qualquer "flash".
    (function() {
      function aplicarUsuarioLogado(cache, ehProfissional) {
        var userArea = document.getElementById('userArea');
        var btnAreaCliente = document.getElementById('btnAreaCliente');
        var mobileUserArea = document.getElementById('mobileUserArea');
        var mobileBtnAreaCliente = document.getElementById('mobileBtnAreaCliente');
        var btnAreaProfissional = document.getElementById('btnAreaProfissional');
        var mobileBtnAreaProfissional = document.getElementById('mobileBtnAreaProfissional');
        var userAreaLink = document.getElementById('userAreaLink');
        var userAreaLinkText = document.getElementById('userAreaLinkText');
        var mobileUserAreaLink = document.getElementById('mobileUserAreaLink');
        var mobileUserAreaLinkText = document.getElementById('mobileUserAreaLinkText');

        var mine = ehProfissional ? '' : '';
        var label = ehProfissional ? 'Minha Área' : 'Minha Área';

        if (userArea) userArea.style.display = 'flex';
        if (btnAreaCliente) btnAreaCliente.style.display = 'none';
        if (mobileUserArea) mobileUserArea.style.display = 'flex';
        if (mobileBtnAreaCliente) mobileBtnAreaCliente.style.display = 'none';
        if (btnAreaProfissional) btnAreaProfissional.style.display = 'none';
        if (mobileBtnAreaProfissional) mobileBtnAreaProfissional.style.display = 'none';

        if (userAreaLink) userAreaLink.href = mine;
        if (userAreaLinkText) userAreaLinkText.textContent = label;
        if (mobileUserAreaLink) mobileUserAreaLink.href = mine;
        if (mobileUserAreaLinkText) mobileUserAreaLinkText.textContent = label;

        if (document.getElementById('userName')) document.getElementById('userName').textContent = cache.nome || (ehProfissional ? 'Profissional' : 'Cliente');
        if (document.getElementById('mobileUserName')) document.getElementById('mobileUserName').textContent = cache.nome || (ehProfissional ? 'Profissional' : 'Cliente');
        var avatarHtml = cache.foto ? '<img src="' + cache.foto + '" alt="Foto">' : '👤';
        if (document.getElementById('userAvatar')) document.getElementById('userAvatar').innerHTML = avatarHtml;
        if (document.getElementById('mobileUserAvatar')) document.getElementById('mobileUserAvatar').innerHTML = avatarHtml;
      }

      function aplicarDeslogado() {
        var userArea = document.getElementById('userArea');
        var btnAreaCliente = document.getElementById('btnAreaCliente');
        var mobileUserArea = document.getElementById('mobileUserArea');
        var mobileBtnAreaCliente = document.getElementById('mobileBtnAreaCliente');
        var btnAreaProfissional = document.getElementById('btnAreaProfissional');
        var mobileBtnAreaProfissional = document.getElementById('mobileBtnAreaProfissional');

        if (userArea) userArea.style.display = 'none';
        if (btnAreaCliente) btnAreaCliente.style.display = '';
        if (mobileUserArea) mobileUserArea.style.display = 'none';
        if (mobileBtnAreaCliente) mobileBtnAreaCliente.style.display = '';
        if (btnAreaProfissional) btnAreaProfissional.style.display = '';
        if (mobileBtnAreaProfissional) mobileBtnAreaProfissional.style.display = '';
      }

      try {
        var clienteCache = JSON.parse(localStorage.getItem('acheei_cliente_cache') || 'null');
        var clienteToken = localStorage.getItem('acheei_cliente_token');
        var profCache = JSON.parse(localStorage.getItem('acheei_prof_cache') || 'null');
        var profToken = localStorage.getItem('acheei_prof_token');

        if (clienteCache && clienteToken) {
          aplicarUsuarioLogado(clienteCache, false);
        } else if (profCache && profToken) {
          aplicarUsuarioLogado(profCache, true);
        } else {
          aplicarDeslogado();
        }
      } catch (e) {}
    })();
  </script>

    /* ===== Página Contato - Estilos ===== */
    .header { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);

    .contato-hero h1 { font-size: 46px; font-weight: 800; margin-bottom: 16px; }
    .contato-hero h1 .hl { color: var(--red-primary); }
    .contato-hero p { font-size: 18px; color: rgba(255,255,255,0.85); max-width: 560px; margin: 0 auto; line-height: 1.7; }

    /* Cards de contato */
    .contato-cards { max-width: 1200px; margin: -50px auto 0; padding: 0 20px; position: relative; z-index: 5; }
    .contato-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .contato-info-card {

    .contato-info-card h4 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }

    .contato-info-card a { color: var(--red-primary); font-weight: 600; }

    /* Formulário + info */
    .contato-main { max-width: 1200px; margin: 0 auto; padding: 70px 20px; }
    .contato-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: start; }

    .form-wrapper { background: #fff; border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-md); border: 1px solid var(--gray-lighter); }
    .form-wrapper h3 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .form-wrapper .sub { color: var(--gray-medium); font-size: 15px; margin-bottom: 28px; }
    .form-wrapper .form-group { margin-bottom: 20px; }
    .form-wrapper label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-dark); margin-bottom: 6px; }
    .form-wrapper input, .form-wrapper select, .form-wrapper textarea {
      width: 100%; padding: 13px 16px; border: 2px solid var(--gray-lighter); border-radius: var(--radius-sm);
      font-size: 15px; transition: var(--transition); font-family: var(--font-primary); background: var(--white); color: var(--black-primary);
    }
    .form-wrapper input:focus, .form-wrapper select:focus, .form-wrapper textarea:focus {
      outline: none; border-color: var(--red-primary); box-shadow: 0 0 0 3px rgba(255,0,0,0.1);
    }
    .form-wrapper textarea { resize: vertical; min-height: 130px; }
    .form-wrapper .btn-submit { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }
    .form-success { display: none; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 20px; font-size: 14px; text-align: center; }

    /* Info lateral */
    .side-section { background: #fff; border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow-md); border: 1px solid var(--gray-lighter); margin-bottom: 24px; }
    .side-section h4 { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .side-section ul { list-style: none; }
    .side-section ul li { display: flex; gap: 12px; padding: 10px 0; color: var(--gray-medium); font-size: 14px; align-items: flex-start; }
    .side-section ul li .li-icon { color: var(--red-primary); flex-shrink: 0; font-size: 18px; width: 22px; text-align: center; }
    .side-section ul li strong { color: var(--black-primary); }
    .faq-item { border-bottom: 1px solid var(--gray-lighter); padding: 14px 0; }
    .faq-item:last-child { border-bottom: none; }
    .faq-item h5 { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--black-primary); }
    .faq-item p { color: var(--gray-medium); font-size: 14px; line-height: 1.6; }

    .contato-footer { background: var(--black-primary); color: #fff; padding: 50px 20px 30px; }
    .contato-footer .ft-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3,1fr); gap: 40px; }
    .contato-footer h4 { color: var(--red-primary); font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    .contato-footer p, .contato-footer li a { color: var(--gray-light); font-size: 14px; line-height: 1.8; }
    .contato-footer li a:hover { color: var(--red-primary); }
    .contato-footer .ft-bottom { max-width: 1200px; margin: 36px auto 0; padding-top: 18px; border-top: 1px solid var(--gray-dark); text-align: center; color: var(--gray-light); font-size: 14px; }

    @media (max-width: 768px) {
      .contato-hero h1 { font-size: 32px; }
      .contato-cards-grid { grid-template-columns: 1fr; }
      .contato-grid { grid-template-columns: 1fr; }
      .contato-footer .ft-content { grid-template-columns: 1fr; text-align: center; }
      .form-wrapper { padding: 28px 22px; }
    }
    
    .contato-hero {
      background: linear-gradient(135deg, #000 0%, #1a1a1a 45%, #CC0000 100%);
      color: #fff; padding: 80px 20px; text-align: center; position: relative; overflow: hidden;
    }

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var hamburger = document.getElementById('hamburgerBtn');
      var menu = document.getElementById('mobileMenu');
      var overlay = document.getElementById('menuOverlay');
      function toggleMenu() {
        hamburger.classList.toggle('active');
        menu.classList.toggle('active');
        overlay.classList.toggle('active');
        document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : '';
      }
      hamburger.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);

      // Dropdown do usuário (avatar + nome)
      setupUserDropdown();

      // Formulário de contato
      document.getElementById('contatoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var nome = document.getElementById('nome').value.trim();
        var email = document.getElementById('email').value.trim();
        var assunto = document.getElementById('assunto').value;
        var mensagem = document.getElementById('mensagem').value.trim();
        if (!nome || !email || !assunto || !mensagem) return;
        document.getElementById('formSuccess').style.display = 'block';
        this.reset();
        setTimeout(function() {
          document.getElementById('formSuccess').style.display = 'none';
        }, 5000);
      });
    });
  </script>
